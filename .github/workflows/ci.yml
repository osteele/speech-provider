name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome CI
        run: bunx biome ci src test

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test package
        run: node --input-type=module -e "import('./dist/index.js')"

      - name: Test
        run: bun test
